<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DriveTrack - Login - DEMO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="min-h-screen bg-[#f8fafc]">
<div class="w-full bg-slate-900 text-white text-[11px] tracking-wide py-2.5 px-4 text-center">⚠ DEMO CONCEPT — Portfolio Mockup — Not affiliated with any government department</div>
<div class="min-h-[calc(100vh-36px)] flex items-center justify-center p-4">
  <div class="w-full max-w-[440px]">
    <div class="flex items-center gap-3 mb-8">
      <div class="w-10 h-10 rounded-xl bg-[#2563eb] flex items-center justify-center shadow-lg text-white">🎓</div>
      <div><div class="font-semibold text-[15px] leading-none">DriveTrack</div><div class="text-[11px] tracking-[0.14em] uppercase text-slate-500 font-medium mt-1">Academy Portal</div></div>
    </div>
    <div class="bg-white rounded-[24px] shadow-[0_24px_64px_-24px_rgba(15,23,42,0.18),0_0_0_1px_rgba(15,23,42,0.04)] p-8">
      <h2 class="text-[22px] font-semibold tracking-tight">Welcome back</h2>
      <p class="text-[13.5px] text-slate-500 mt-2 leading-relaxed">Sign in to your private academy workspace. This is a demo — no real authentication required.</p>
      <div class="mt-6">
        <label class="text-[12px] font-medium text-slate-600 mb-1.5 block">Work email</label>
        <input id="emailInput" placeholder="you@drivetrack.demo" class="w-full h-[44px] rounded-xl border border-slate-200 bg-slate-50/60 px-3 text-[14px] outline-none focus:bg-white focus:border-[#2563eb] focus:ring-4 focus:ring-blue-50 transition-all" />
        <button id="loginBtn" class="mt-4 w-full h-[44px] rounded-xl bg-slate-900 text-white text-[14px] font-medium hover:bg-black transition-colors flex items-center justify-center gap-2">
          <span id="loginText">Continue to workspace →</span>
          <span id="loginLoader" class="hidden">Signing in…</span>
        </button>
        <p class="text-[11px] text-slate-400 mt-3 text-center">Clicking will open search.html — your demo search page</p>
      </div>
    </div>
  </div>
</div>
<script>
const btn = document.getElementById('loginBtn');
const input = document.getElementById('emailInput');
function doLogin(){
  const val = input.value.trim();
  if(!val.includes('@')){ input.classList.add('border-red-400','ring-2','ring-red-100'); return; }
  document.getElementById('loginText').classList.add('hidden');
  document.getElementById('loginLoader').classList.remove('hidden');
  btn.disabled=true;
  localStorage.setItem('demo_email', val);
  setTimeout(()=>{ window.location.href = 'search.html'; }, 800);
}
btn.onclick = doLogin;
input.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
